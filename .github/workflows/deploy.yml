name: Build and Deploy

on:
    push:
        branches: [main]
        # Generated legacy market data does not affect the Content Studio build.
        paths-ignore:
            - 'public/data/**'
            - 'public/calendar/**'
            - 'public/sidebar/**'
            - 'public/sidebar-tickers.json'
            - 'public/nav.json'
            - 'public/exchange-rates.json'
            - 'public/missing-logos.json'

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (shallow + blob filter)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2 # 이전 커밋과 비교하기 위해 2개 커밋 필요
                  filter: blob:none # 큰 파일을 즉시 받지 않음(접근 시 필요분만 받음)
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Free Disk Space
              run: |
                  sudo rm -rf /usr/local/lib/android
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /usr/local/share/boost
                  sudo rm -rf "$AGENT_TOOLSDIRECTORY"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'

            - name: Install Python deps
              run: pip install -r requirements-workflow.txt

            - name: Check for dividend changes
              id: check_dividend
              run: |
                  python scripts/workflows/check_dividend_changes.py

            # Content Studio does not serve legacy market data or thumbnails.
            - name: Remove large local data before build
              run: |
                  rm -rf public/data public/thumbnail || true

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install deps
              run: npm ci --no-audit --no-fund

            - name: Build Vue App
              run: npm run build

            # 빌드 끝났으면 추가 정리(선택)
            # node_modules 제거는 Post Set up Node.js 단계 이후에 실행되도록
            # 별도 단계로 분리하지 않고 필요시 수동으로 정리

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact (dist only)
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v4
