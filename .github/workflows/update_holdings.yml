# .github/workflows/update_holdings.yml
# Holdings 전용 워크플로우 - 평일 실행

name: Update Holdings Data (Weekdays at 2:30 AM KST)

on:
    # 평일 새벽 2시 30분 (KST) 실행
    schedule:
        - cron: '30 17 * * 1-5' # UTC 17:30 = KST 02:30 (평일, 월-금)
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: 'data-updates'
    cancel-in-progress: false

jobs:
    update-holdings:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main branch
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'
                  cache-dependency-path: 'requirements-workflow.txt'

            - name: Install Node.js dependencies
              run: npm install

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-workflow.txt

            - name: Install Playwright browsers
              run: npx playwright install chromium

            - name: Setup R2 environment variables
              run: |
                  echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> $GITHUB_ENV
                  echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
                  echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
                  echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> $GITHUB_ENV
                  echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
                  echo "✅ R2 환경변수 설정 완료"

            # --- Holdings 수집 파이프라인 ---
            - name: 1. Auto-detect holdings for new tickers
              run: |
                  echo "🔍 Holdings 자동 감지 시작..."
                  python scripts/holdings/auto_detect_holdings.py --api --exclude-kr --yes
                  echo "✅ Holdings 자동 감지 완료"

            - name: 2. Fetch ETF holdings data (Yahoo Finance - 23분 소요)
              run: |
                  echo "📊 ETF Holdings 데이터 수집 시작 (Yahoo Finance - 매일)..."
                  echo "y" | python scripts/holdings/fetch_holdings.py
                  echo "✅ ETF Holdings 데이터 수집 완료"

            - name: 3. Scrape Roundhill holdings (Playwright - 3-5분 소요)
              run: |
                  echo "🎭 Roundhill ETF Holdings 자동 스크래핑 시작 (매일)..."
                  node scripts/holdings/scrape_roundhill_holdings_playwright.js --all

                  # 스크래핑한 배치 파일을 Python으로 등록
                  BATCH_FILE=$(ls -t public/holdings/roundhill_*_playwright.txt 2>/dev/null | head -1)
                  if [ -f "$BATCH_FILE" ]; then
                    echo "📦 배치 파일 발견: $BATCH_FILE"
                    python scripts/holdings/add_roundhill_holdings.py --batch "$BATCH_FILE"
                    echo "✅ Roundhill Holdings 등록 완료"
                    # 처리 완료 후 이전 파일 자동 삭제됨 (스크립트 내부에서 처리)
                  else
                    echo "⚠️ Roundhill 배치 파일을 찾을 수 없습니다. 스크래핑 실패 가능성"
                  fi

            - name: 4. Download ARK holdings CSV (10초 소요)
              run: |
                  echo "📥 ARK ETF Holdings CSV 다운로드 시작..."
                  node scripts/holdings/scrape_ark_holdings.js --all

                  # 다운로드한 배치 파일을 Python으로 등록
                  BATCH_FILE=$(ls -t public/holdings/ark_*_csv.txt 2>/dev/null | head -1)
                  if [ -f "$BATCH_FILE" ]; then
                    echo "📦 ARK 배치 파일 발견: $BATCH_FILE"
                    python scripts/holdings/add_roundhill_holdings.py --batch "$BATCH_FILE"
                    echo "✅ ARK Holdings 등록 완료"
                    # 처리 완료 후 이전 파일 자동 삭제됨 (스크립트 내부에서 처리)
                  else
                    echo "⚠️ ARK 배치 파일을 찾을 수 없습니다."
                  fi

            - name: 5. Download iShares holdings (JSON API + CSV - 20초 소요)
              run: |
                  echo "📥 iShares ETF Holdings 수집 시작 (JSON API + CSV)..."
                  python scripts/holdings/scrape_ishares_holdings.py --all

                  # 수집한 배치 파일을 Python으로 등록
                  BATCH_FILE=$(ls -t public/holdings/ishares_*_csv.txt 2>/dev/null | head -1)
                  if [ -f "$BATCH_FILE" ]; then
                    echo "📦 iShares 배치 파일 발견: $BATCH_FILE"
                    python scripts/holdings/add_roundhill_holdings.py --batch "$BATCH_FILE"
                    echo "✅ iShares Holdings 등록 완료"
                    # 처리 완료 후 이전 파일 자동 삭제됨 (스크립트 내부에서 처리)
                  else
                    echo "⚠️ iShares 배치 파일을 찾을 수 없습니다."
                  fi

            - name: 6. Format changed files only
              run: |
                  echo "📝 변경된 파일만 포맷 중..."
                  echo "포맷팅 전 변경사항:"
                  git status --porcelain || echo "변경사항 없음"

                  # 포맷팅 실행
                  if npm run format:changed; then
                    echo "✅ 포맷팅 완료"
                  else
                    echo "⚠️ 포맷팅 중 오류 발생, 계속 진행합니다."
                  fi

                  # 포맷팅 후 변경사항 확인
                  echo "포맷팅 후 변경사항:"
                  FORMATTED_CHANGES=$(git status --porcelain || echo "")
                  if [[ -n "$FORMATTED_CHANGES" ]]; then
                    echo "📋 포맷팅으로 인한 변경사항:"
                    echo "$FORMATTED_CHANGES"
                  else
                    echo "ℹ️ 포맷팅으로 인한 변경사항 없음"
                  fi

            - name: 7. Upload changed files to R2
              run: |
                  echo "📤 R2에 변경된 파일 업로드 중..."
                  python scripts/cloud/upload_changed_to_r2.py
                  echo "✅ R2 업로드 완료"

            # --- 변경 사항 커밋 및 푸시 ---
            - name: Check for file changes
              id: git_status
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    echo "changes=true" >> $GITHUB_OUTPUT
                  else
                    echo "changes=false" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push changes
              if: steps.git_status.outputs.changes == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .
                  COMMIT_MSG="📊 Auto: Update holdings data (daily)

                  Changed files:
                  $(git status --porcelain)"
                  git commit -m "$COMMIT_MSG"

                  # 푸시 재시도 로직 (최대 3번)
                  for i in 1 2 3; do
                    if git push; then
                      echo "✅ 푸시 성공!"
                      exit 0
                    else
                      echo "⚠️ 푸시 실패 (시도 $i/3). 원격 변경사항 가져오는 중..."
                      git pull --rebase origin main
                      if [ $i -eq 3 ]; then
                        echo "❌ 3번 시도 후 푸시 실패"
                        exit 1
                      fi
                      sleep 5
                    fi
                  done
