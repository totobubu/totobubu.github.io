# .github/workflows/update_info_data.yml

name: Update Info Data (Daily at 2 AM KST)

on:
    # [V1 테스트] 월/수/금 실행: 한국시간 새벽 2시 (UTC 17:00)
    schedule:
        - cron: '0 17 * * 1,3,5' # UTC 17:00 = KST 02:00 (월/수/금)
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: 'data-updates' # 모든 데이터 업데이트 워크플로우를 하나의 그룹으로 묶음
    cancel-in-progress: false # 진행 중인 작업은 취소하지 않고 대기

jobs:
    update-info:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main branch
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'
                  cache-dependency-path: 'requirements.txt'

            - name: Install Node.js dependencies
              run: npm install

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Setup R2 environment variables
              run: |
                  echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> $GITHUB_ENV
                  echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
                  echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
                  echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> $GITHUB_ENV
                  echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
                  echo "✅ R2 환경변수 설정 완료"

            # --- 정보성 데이터 업데이트 파이프라인 ---
            - name: 3. Update exchange rate data
              run: node scripts/fetch_all_exchange_rates.js

            - name: 4. Sync IPO dates and upcoming status
              run: npm run add-ipo-dates

            - name: 5. Analyze and add dividend frequency
              run: python scripts/analyze_dividend_frequency.py

            - name: 6. Generate final nav.json
              run: npm run generate-nav

            - name: 6.5. Auto-detect and update holdings for new tickers
              run: |
                  echo "🔍 Holdings 자동 감지 시작..."
                  python scripts/auto_detect_holdings.py --api --exclude-kr --yes
                  echo "✅ Holdings 자동 감지 완료"

            - name: 6.6. Fetch ETF holdings data
              run: |
                  echo "📊 ETF Holdings 데이터 수집 시작..."
                  echo "y" | python scripts/fetch_holdings.py
                  echo "✅ ETF Holdings 데이터 수집 완료"

            - name: 7. Update daily market capitalization (Yahoo Finance)
              run: python scripts/update_market_cap.py

            - name: 8. Update historical dividend data
              run: python scripts/update_dividends.py

            - name: 9. Process and enrich dividend history
              run: python scripts/scraper_dividend.py

            - name: 9.5. Clean and sanitize historical data
              run: python scripts/clean_data.py

            - name: 10. Update latest ticker info
              run: python scripts/scraper_info.py

            - name: 11.5. Project future expected dividend dates
              run: python scripts/project_future_dividends.py

            - name: 12. Generate calendar events data
              run: npm run generate-calendar-events

            - name: 14. Format changed files only
              run: |
                  echo "📝 변경된 파일만 포맷 중..."
                  npm run format:changed
                  echo "✅ 포맷 완료"

            - name: 15. Upload changed files to R2 (Git-based, fast)
              run: |
                  echo "📤 R2에 변경된 파일 업로드 중 (Git 기반)..."
                  python scripts/upload_changed_to_r2.py
                  echo "✅ R2 업로드 완료"

            # --- 변경 사항 커밋 및 푸시 ---
            - name: Check for file changes
              id: git_status
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    echo "changes=true" >> $GITHUB_OUTPUT
                  else
                    echo "changes=false" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push changes
              if: steps.git_status.outputs.changes == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .
                  COMMIT_MSG="ℹ️ Auto: Update info data (daily)

                  Changed files:
                  $(git status --porcelain)"
                  git commit -m "$COMMIT_MSG"
                  
                  # 푸시 재시도 로직 (최대 3번)
                  for i in 1 2 3; do
                    if git push; then
                      echo "✅ 푸시 성공!"
                      exit 0
                    else
                      echo "⚠️ 푸시 실패 (시도 $i/3). 원격 변경사항 가져오는 중..."
                      git pull --rebase origin main
                      if [ $i -eq 3 ]; then
                        echo "❌ 3번 시도 후 푸시 실패"
                        exit 1
                      fi
                      sleep 5
                    fi
                  done

