# .github/workflows/update_info_data_v2.yml
# [V2] 통합 파이프라인 버전 - 속도 비교용

name: Update Info Data V2 (Optimized Pipeline)

on:
    # 하루 1회 실행: 한국시간 새벽 2시 (UTC 17:00) - 기존 워크플로우와 1시간 차이
    schedule:
        - cron: '0 17 * * *' # UTC 17:00 = KST 02:00
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-info-v2:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main branch
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'
                  cache-dependency-path: 'requirements.txt'

            - name: Install Node.js dependencies
              run: npm install

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Setup R2 environment variables
              run: |
                  echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> $GITHUB_ENV
                  echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
                  echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
                  echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> $GITHUB_ENV
                  echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
                  echo "✅ R2 환경변수 설정 완료"

            # --- [V2] 통합 파이프라인: 단 3개의 스텝으로 정보성 데이터 완료 ---
            - name: 1. Update exchange rate data (JS)
              run: node scripts/fetch_all_exchange_rates.js

            - name: 2. Sync IPO dates and upcoming status (JS)
              run: npm run add-ipo-dates

            - name: 3. Generate final nav.json (JS)
              run: npm run generate-nav

            - name: 4. Auto-detect and update holdings (Python)
              run: |
                  echo "🔍 Holdings 자동 감지 시작..."
                  python scripts/auto_detect_holdings.py --api --exclude-kr --yes
                  echo "✅ Holdings 자동 감지 완료"

            - name: 5. Fetch ETF holdings data (Python)
              run: |
                  echo "📊 ETF Holdings 데이터 수집 시작..."
                  echo "y" | python scripts/fetch_holdings.py
                  echo "✅ ETF Holdings 데이터 수집 완료"

            # --- [핵심] 통합 파이프라인으로 여러 스텝을 한 번에 처리 ---
            - name: 6. [V2 PIPELINE] Update all info data (dividends, info, market_cap, frequency, projection)
              run: |
                  echo "🚀 통합 정보성 데이터 파이프라인 시작..."
                  python scripts/info_data_pipeline.py
                  echo "✅ 통합 정보성 데이터 파이프라인 완료"

            - name: 7. Process and enrich dividend history (scraper_dividend)
              run: python scripts/scraper_dividend.py

            - name: 8. Clean and sanitize historical data
              run: python scripts/clean_data.py

            - name: 9. Generate calendar events data (JS)
              run: npm run generate-calendar-events

            - name: 10. Format changed files only
              run: |
                  echo "📝 변경된 파일만 포맷 중..."
                  npm run format:changed
                  echo "✅ 포맷 완료"

            - name: 11. Upload changed files to R2 (Git-based, fast)
              run: |
                  echo "📤 R2에 변경된 파일 업로드 중 (Git 기반)..."
                  python scripts/upload_changed_to_r2.py
                  echo "✅ R2 업로드 완료"

            # --- 변경 사항 커밋 및 푸시 ---
            - name: Check for file changes
              id: git_status
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    echo "changes=true" >> $GITHUB_OUTPUT
                  else
                    echo "changes=false" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push changes
              if: steps.git_status.outputs.changes == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .
                  COMMIT_MSG="ℹ️ Auto: Update info data V2 (optimized pipeline)

                  Changed files:
                  $(git status --porcelain)"
                  git commit -m "$COMMIT_MSG"
                  git push
