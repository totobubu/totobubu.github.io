name: Market Data v2 US

on:
    schedule:
        # 미국 증시 마감 후 1시간 (오후 5시 EST = UTC 22:00)
        # 일광절약시간 고려: UTC 21:00 또는 22:00
        - cron: '0 21 * * 1-5'  # 월-금 오후 5시 EST (UTC 21:00)
        - cron: '0 22 * * 1-5'  # 월-금 오후 5시 EST (UTC 22:00, 일광절약시간)
    workflow_dispatch:
        inputs:
            skip_price_update:
                description: 'Skip npm run update-data step'
                required: false
                default: 'false'

concurrency:
    group: market-data-v2-us
    cancel-in-progress: true

env:
    NODE_VERSION: '20'
    PYTHON_VERSION: '3.11'

jobs:
    build-us:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'npm'

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: 'pip'
                  cache-dependency-path: 'requirements-workflow.txt'

            - name: Install Node.js dependencies
              run: npm ci

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-workflow.txt

            - name: Setup R2 environment variables
              run: |
                  echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> $GITHUB_ENV
                  echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
                  echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
                  echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> $GITHUB_ENV
                  echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV

            - name: Update historical price data (US only)
              if: inputs.skip_price_update != 'true'
              env:
                  MARKET_FILTER: US
              run: npm run update-data

            - name: Run info data pipeline (US only, market layout)
              env:
                  FIRESTORE_SA_KEY: ${{ secrets.FIRESTORE_SA_KEY }}
                  DATA_LAYOUT_MODE: market
                  MARKET_FILTER: US
              run: python scripts/info_data_pipeline.py

            - name: Format changed files
              run: npm run format:changed

            - name: Upload changed public assets to R2
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
              run: python scripts/upload_changed_to_r2.py

            - name: Pull Vercel environment (preview)
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  npx vercel pull --yes \
                    --environment=preview \
                    --token="$VERCEL_TOKEN" \
                    --org-id="$VERCEL_ORG_ID" \
                    --project-id="$VERCEL_PROJECT_ID"

            - name: Build Vercel preview (market layout)
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
                  DATA_LAYOUT_MODE: market
              run: |
                  npx vercel build \
                    --token="$VERCEL_TOKEN" \
                    --org-id="$VERCEL_ORG_ID" \
                    --project-id="$VERCEL_PROJECT_ID"

            - name: Deploy to Vercel preview
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
                  DATA_LAYOUT_MODE: market
              run: |
                  npx vercel deploy --prebuilt \
                    --token="$VERCEL_TOKEN" \
                    --org-id="$VERCEL_ORG_ID" \
                    --project-id="$VERCEL_PROJECT_ID"

