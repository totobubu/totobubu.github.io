# .github/workflows/update_market_data.yml

name: Update Market Data (Twice Daily)

on:
    # 하루 2회 실행: 미국 증시 마감 후, 한국 증시 마감 후
    # - 미국: UTC 21:00 또는 22:00 (서머타임 여부에 따라)
    # - 한국: UTC 07:30 (연중 동일)
    schedule:
        - cron: '0 21 * * 1-5' # UTC 21:00 (미국 서머타임 적용 시: 오전 6시 KST)
        - cron: '0 22 * * 1-5' # UTC 22:00 (미국 서머타임 미적용 시: 오전 7시 KST)
        - cron: '30 7 * * 1-5' # UTC 07:30 (오후 4시 30분 KST, 한국 증시 마감 후)
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-market:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main branch
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'
                  cache: 'pip'
                  cache-dependency-path: 'requirements.txt'

            - name: Install Node.js dependencies
              run: npm install

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Setup R2 environment variables
              run: |
                  echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> $GITHUB_ENV
                  echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
                  echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
                  echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> $GITHUB_ENV
                  echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
                  echo "✅ R2 환경변수 설정 완료"

            # --- 서머타임 감지 및 스킵 로직 ---
            - name: Check if should run
              id: check_time
              run: |
                  # 수동 실행(workflow_dispatch)인 경우 항상 실행
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "should_run=true" >> $GITHUB_OUTPUT
                    echo "schedule_type=manual" >> $GITHUB_OUTPUT
                    exit 0
                  fi

                  # 현재 UTC 시간과 월 정보
                  UTC_HOUR=$(date -u +%H)
                  UTC_MONTH=$(date -u +%m)
                  UTC_DOW=$(date -u +%u)  # 1-7 (Mon-Sun)

                  # 한국 증시 마감 후 (UTC 07:30)인 경우 항상 실행
                  if [ "$UTC_HOUR" = "07" ] || [ "$UTC_HOUR" = "7" ]; then
                    echo "should_run=true" >> $GITHUB_OUTPUT
                    echo "schedule_type=kr_market" >> $GITHUB_OUTPUT
                    exit 0
                  fi

                  # 미국 증시 마감 후 (UTC 21:00 또는 22:00)인 경우
                  if [ "$UTC_HOUR" = "21" ] || [ "$UTC_HOUR" = "22" ]; then
                    # 서머타임 기간 체크 (3월 2주째 일요일 이후 ~ 11월 1주째 일요일 이전)
                    # 간단히 월로 판단 (3-10월: 서머타임 적용, UTC 21:00)
                    # 11-2월: 서머타임 미적용, UTC 22:00
                    if [ "$UTC_MONTH" -ge 3 ] && [ "$UTC_MONTH" -le 10 ]; then
                      # 서머타임 적용 기간: UTC 21:00만 실행
                      if [ "$UTC_HOUR" = "21" ]; then
                        echo "should_run=true" >> $GITHUB_OUTPUT
                        echo "schedule_type=us_market_dst" >> $GITHUB_OUTPUT
                      else
                        echo "should_run=false" >> $GITHUB_OUTPUT
                      fi
                    else
                      # 서머타임 미적용 기간: UTC 22:00만 실행
                      if [ "$UTC_HOUR" = "22" ]; then
                        echo "should_run=true" >> $GITHUB_OUTPUT
                        echo "schedule_type=us_market_std" >> $GITHUB_OUTPUT
                      else
                        echo "should_run=false" >> $GITHUB_OUTPUT
                      fi
                    fi
                  else
                    # 예상하지 못한 시간대
                    echo "should_run=false" >> $GITHUB_OUTPUT
                  fi

            # --- 시장 데이터 업데이트 파이프라인 (가격 중심) ---
            - name: 7. Update historical price data
              if: steps.check_time.outputs.should_run == 'true'
              run: npm run update-data

            - name: 11. Aggregate bookmark popularity
              if: steps.check_time.outputs.should_run == 'true'
              env:
                  FIRESTORE_SA_KEY: ${{ secrets.FIRESTORE_SA_KEY }}
              run: python scripts/aggregate_popularity.py

            - name: 13. Generate sidebar tickers data
              if: steps.check_time.outputs.should_run == 'true'
              run: python scripts/generate_sidebar_tickers.py

            - name: 14. Format changed files only
              if: steps.check_time.outputs.should_run == 'true'
              run: |
                  echo "📝 변경된 파일만 포맷 중..."
                  npm run format:changed
                  echo "✅ 포맷 완료"

            - name: 15. Upload changed files to R2 (Git-based, fast)
              if: steps.check_time.outputs.should_run == 'true'
              run: |
                  echo "📤 R2에 변경된 파일 업로드 중 (Git 기반)..."
                  python scripts/upload_changed_to_r2.py
                  echo "✅ R2 업로드 완료"

            # --- 변경 사항 커밋 및 푸시 ---
            - name: Check for file changes
              id: git_status
              if: steps.check_time.outputs.should_run == 'true'
              run: |
                  if [[ -n "$(git status --porcelain)" ]]; then
                    echo "changes=true" >> $GITHUB_OUTPUT
                  else
                    echo "changes=false" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push changes
              if: steps.check_time.outputs.should_run == 'true' && steps.git_status.outputs.changes == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .
                  COMMIT_MSG="📈 Auto: Update market data (${{ steps.check_time.outputs.schedule_type }})

                  Changed files:
                  $(git status --porcelain)"
                  git commit -m "$COMMIT_MSG"
                  git push

